<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Notes App</h1>
      <p class="subtitle">Componente 5 · Docker + Node.js</p>
    </header>

    <form id="note-form">
      <textarea id="note-content" placeholder="Escribe una nota..." required></textarea>
      <button type="submit">Agregar nota</button>
    </form>

    <div id="notes-list" class="notes-grid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
